name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    secrets:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Publish
        run: npm publish
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
