name: Publish
on:
  push:
    tags:
      - v*
concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read
      packages: read
    secrets:
      NPM_READ_TOKEN: ${{ secrets.NPM_READ_TOKEN || secrets.GHCR_TOKEN }}
      CONFIGS_READ_TOKEN: ${{ secrets.CONFIGS_READ_TOKEN }}
  publish:
    needs: verify
    uses: JanKrajewskiIT/velvetconfigs/.github/workflows/publish-package.yml@7ca311c70a4f694a76ae02a9a90166f704f6c0e1 # v3.6.5
    permissions:
      contents: read
      packages: write
      id-token: write
    secrets:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      CONFIGS_READ_TOKEN: ${{ secrets.CONFIGS_READ_TOKEN }}
permissions:
  contents: read
