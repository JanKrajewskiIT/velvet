name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '41 6 * * 2'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  analysis:
    uses: JanKrajewskiIT/velvetconfigs/.github/workflows/codeql-analysis.yml@7ca311c70a4f694a76ae02a9a90166f704f6c0e1 # v3.6.5
    permissions:
      actions: read
      contents: read
      security-events: write
