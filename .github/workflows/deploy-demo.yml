name: Deploy Demo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: velvet-demo

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    secrets:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

  # ==================
  # Build & Push Docker image
  # ==================
  publish:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ github.sha }}
      owner_lc: ${{ steps.vars.outputs.owner_lc }}

    steps:
      - uses: actions/checkout@v6

      - name: Set variables
        id: vars
        run: echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push demo image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: demo/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner_lc }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner_lc }}/${{ env.IMAGE_NAME }}:latest
          secrets: |
            github_token=${{ secrets.GHCR_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==================
  # Deploy to VPS
  # ==================
  deploy:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      IMAGE_TAG: ${{ needs.publish.outputs.image_tag }}
      OWNER_LC: ${{ needs.publish.outputs.owner_lc }}

    steps:
      - uses: actions/checkout@v6

      - name: Copy compose file to VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: 'deploy/docker-compose.yml'
          target: '/opt/velvet'
          strip_components: 1
          timeout: 60s

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          REGISTRY: ghcr.io
          OWNER_LC: ${{ env.OWNER_LC }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          IMAGE_NAME: velvet-demo
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: REGISTRY,OWNER_LC,IMAGE_TAG,IMAGE_NAME,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd /opt/velvet

            # Create .env with image tag
            cat > .env <<EOF
            VELVET_DEMO_IMAGE=${REGISTRY}/${OWNER_LC}/${IMAGE_NAME}:${IMAGE_TAG}
            EOF

            # Ensure proxy network exists (created by Traefik)
            docker network inspect proxy >/dev/null 2>&1 || docker network create proxy

            # Login, pull, deploy
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${OWNER_LC}" --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans

            # Cleanup
            docker image prune -f
            docker compose ps

      - name: Smoke test
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail

            echo "Waiting for container to become healthy..."
            for i in $(seq 1 12); do
              if docker ps --filter "name=velvet-demo" --format "{{.Status}}" | grep -q "healthy"; then
                echo "Container is healthy."
                break
              fi
              if [ "$i" -eq 12 ]; then
                echo "ERROR: Container did not become healthy within 60s"
                docker ps --filter "name=velvet-demo" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
                exit 1
              fi
              sleep 5
            done

            echo "Checking HTTPS endpoint via Traefik (cert may take a moment)..."
            sleep 30
            curl -sf --retry 5 --retry-delay 15 --max-time 15 https://velvet.bluebraces.online/ > /dev/null && echo "Demo: OK (valid cert)" || \
            curl -sf --retry 3 --retry-delay 10 --max-time 15 -k https://velvet.bluebraces.online/ > /dev/null && echo "Demo: OK (cert pending, Traefik routing works)" || \
            { echo "ERROR: Demo not reachable via HTTPS"; curl -v https://velvet.bluebraces.online/ 2>&1 | tail -20; exit 1; }

            echo "Smoke test completed."
