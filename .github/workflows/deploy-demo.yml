name: Deploy Demo

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@jankrajewskiit'

      - name: Install root dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify library
        run: npm run verify

      - name: Install demo dependencies
        run: npm ci
        working-directory: demo
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build demo
        run: npm run build
        working-directory: demo

      - name: Validate FTP secrets
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          missing=()
          [[ -z "$FTP_SERVER" ]] && missing+=("FTP_SERVER")
          [[ -z "$FTP_USERNAME" ]] && missing+=("FTP_USERNAME")
          [[ -z "$FTP_PASSWORD" ]] && missing+=("FTP_PASSWORD")
          [[ -z "$FTP_SERVER_DIR" ]] && missing+=("FTP_SERVER_DIR")

          if (( ${#missing[@]} )); then
            echo "Missing required repository secrets: ${missing[*]}"
            echo "Set them in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./demo/dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          dangerous-clean-slate: true
