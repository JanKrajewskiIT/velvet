const MODES=['light','dark','compact'];
const out=document.getElementById('out'),stage=document.getElementById('stage');
let bad=0,done=0;const total=CARDS.length*MODES.length;
function run(i,m){return new Promise(res=>{const [p,w,h,name]=CARDS[i];const f=document.createElement('iframe');f.style.width=w+'px';f.style.height=h+'px';f.style.border='0';const errs=[];
 let fin=false;const finish=()=>{if(fin)return;fin=true;let issues=[...errs];try{const d=f.contentDocument;const b=d.body;
  if(m==='dark')d.documentElement.setAttribute('data-theme','dark');if(m==='compact')d.documentElement.setAttribute('data-density','compact');
  const sh=Math.max(b.scrollHeight,d.documentElement.scrollHeight),sw=Math.max(b.scrollWidth,d.documentElement.scrollWidth);
  if(sh>h+2)issues.push('overflow-y '+sh+'>'+h);if(sw>w+2)issues.push('overflow-x '+sw+'>'+w);
  const r=d.getElementById('root');if(r&&!r.children.length)issues.push('empty #root');
  const unresolved=[];d.querySelectorAll('body *').forEach(el=>{const cs=f.contentWindow.getComputedStyle(el);if(cs.fontSize==='0px'&&el.textContent.trim())unresolved.push(el.className)});if(unresolved.length)issues.push('0px text: '+unresolved.slice(0,3).join(','));
 }catch(e){issues.push('inspect failed '+e.message)}
 const tr=document.createElement('tr');tr.dataset.bad=issues.length?1:0;tr.innerHTML='<td>'+name+' <small style="color:#888">'+p+'</small></td><td>'+m+'</td><td class="'+(issues.length?'bad':'ok')+'">'+(issues.length?issues.join(' · '):'ok')+'</td>';if(issues.length){bad++;out.prepend(tr);console.log('SWEEP BAD | '+m+' | '+p+' | '+issues.join(' · '))}else out.append(tr);
 done++;document.getElementById('sum').textContent=done+'/'+total+' checked · '+bad+' with issues';f.remove();res()};
 f.onload=()=>{try{f.contentWindow.addEventListener('error',e=>errs.push('error: '+(e.message||'resource '+(e.target&&e.target.src||''))),true);const ce=f.contentWindow.console.error;f.contentWindow.console.error=(...a)=>{errs.push('console: '+String(a[0]).slice(0,120));ce.apply(f.contentWindow.console,a)};
  if(m==='dark')f.contentDocument.documentElement.setAttribute('data-theme','dark');if(m==='compact')f.contentDocument.documentElement.setAttribute('data-density','compact');}catch(e){}
  (f.contentDocument.fonts?f.contentDocument.fonts.ready:Promise.resolve()).then(()=>setTimeout(finish,1800))};
 setTimeout(finish,9000);
 f.src=p;stage.appendChild(f)})}
(async()=>{const q=[];for(let i=0;i<CARDS.length;i++)for(const m of MODES)q.push([i,m]);const N=6;let k=0;await Promise.all(Array.from({length:N},async()=>{while(k<q.length){const [i,m]=q[k++];await run(i,m)}}));document.getElementById('sum').textContent='DONE · '+total+' checks · '+bad+' with issues';document.body.dataset.done='1';console.log('SWEEP DONE '+total+' bad '+bad)})();
