<!doctype html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0}
body{position:relative;width:960px;height:288px;overflow:hidden;background:var(--bg-page);color:var(--fg-primary);font-family:var(--font-sans)}
svg{position:absolute;left:0;top:0;width:960px;height:120px}
.brand{fill:var(--action-primary)}
.rose{fill:color-mix(in oklab,var(--action-primary) 38%,var(--bg-page))}
.ink{fill:var(--bg-inverse)}
.blush{fill:color-mix(in oklab,var(--action-primary) 19%,var(--bg-page))}
.dot{fill:var(--action-primary)}
.tile{rx:var(--radius-xl)}
.text{position:absolute;left:32px;bottom:32px}
h1{margin:0;font:600 64px/.95 var(--font-display);letter-spacing:var(--tracking-tighter);white-space:nowrap}
p{margin:12px 0 0;font:400 14px/1.4 var(--font-sans);color:var(--fg-secondary)}
</style></head><body>
<svg viewBox="0 0 960 120" aria-hidden="true">
<!--
blocks: action-primary 360×96 (slab), action-primary 38% mix 200×72, bg-inverse 160×96, action-primary 19% mix 240×96, all bleeding off the top edge.
arrangement: a strip of unequal bands across the top, the brand slab first; the rose block is shorter so the strip steps.
pattern: dot grid at space-6 (24px), r 2, over the blush band only — the README calls it CSS-first, token-driven, on a 4px grid with mono data components, so precise and technical.
steps and radii: widths are multiples of space-8; rx radius-xl on every band; dots 9 × 3 = 27.
-->
<rect class="brand tile" x="0" y="-40" width="360" height="136"/>
<rect class="rose tile" x="368" y="-40" width="200" height="112"/>
<rect class="ink tile" x="576" y="-40" width="160" height="136"/>
<rect class="blush tile" x="744" y="-40" width="216" height="136"/>
<g class="dot">
<circle cx="768" cy="24" r="2"/><circle cx="792" cy="24" r="2"/><circle cx="816" cy="24" r="2"/><circle cx="840" cy="24" r="2"/><circle cx="864" cy="24" r="2"/><circle cx="888" cy="24" r="2"/><circle cx="912" cy="24" r="2"/><circle cx="936" cy="24" r="2"/>
<circle cx="768" cy="48" r="2"/><circle cx="792" cy="48" r="2"/><circle cx="816" cy="48" r="2"/><circle cx="840" cy="48" r="2"/><circle cx="864" cy="48" r="2"/><circle cx="888" cy="48" r="2"/><circle cx="912" cy="48" r="2"/><circle cx="936" cy="48" r="2"/>
<circle cx="768" cy="72" r="2"/><circle cx="792" cy="72" r="2"/><circle cx="816" cy="72" r="2"/><circle cx="840" cy="72" r="2"/><circle cx="864" cy="72" r="2"/><circle cx="888" cy="72" r="2"/><circle cx="912" cy="72" r="2"/><circle cx="936" cy="72" r="2"/>
</g>
</svg>
<div class="text"><h1>Velvet UI Design System</h1><p>CSS-first and framework-agnostic, built around one brand colour: velvet.</p></div>
</body></html>
