<!-- @dsCard group="Foundations · Space & Layout" page height=392 width=960 subtitle="Control heights × density — ‑‑control-height-* · data-density" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components/bundle.css"><link rel="stylesheet" href="../../guidelines/card.css"><script src="../../guidelines/theme-toggle.js"></script><script src="../../guidelines/card.js"></script>
<style>
html body{margin:0;padding:var(--space-5) var(--space-6);background:var(--bg-raised);color:var(--fg-primary);font:var(--type-body)}
.z-h{font:var(--type-overline);letter-spacing:var(--type-overline-tracking);text-transform:uppercase;color:var(--fg-tertiary);margin:0 0 var(--space-2)}
.z-k{font:var(--type-medium-weight) var(--type-kbd-size)/1.3 var(--font-mono);color:var(--fg-secondary);overflow-wrap:anywhere}
.z-v{font:var(--type-regular-weight) var(--type-kbd-size)/1.3 var(--font-mono);color:var(--fg-tertiary);white-space:nowrap;font-variant-numeric:tabular-nums}
.z-cap{font:var(--type-caption);color:var(--fg-secondary)}
.z-blocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:var(--space-5) var(--space-8);align-items:start}
.z-item{display:flex;flex-direction:column;gap:var(--space-2);padding:var(--space-3) 0;border-top:var(--border-width) solid var(--border-subtle);min-width:0}
.z-head{display:flex;justify-content:space-between;align-items:baseline;gap:var(--space-3)}
.z-line{display:flex;align-items:center;gap:var(--space-2);min-width:0}
.z-btn{display:flex;align-items:center;flex:none;padding:0 var(--control-pad-x);border-radius:var(--control-radius);background:var(--button-primary-bg);color:var(--button-primary-fg);font:var(--type-button-sm)}
.z-in{flex:1;min-width:48px;max-width:200px;border:var(--border-width) solid var(--control-border);border-radius:var(--control-radius);background:var(--control-bg);box-sizing:border-box}
.z-bar{height:14px;max-width:100%;border-radius:var(--radius-sm);background:var(--action-soft)}
.z-box{max-width:240px;box-sizing:border-box}
</style></head><body>
<div class="z-blocks"><div><div class="z-h">comfortable</div><div class="z-item" data-density="comfortable"><div class="z-head"><span class="z-k">--control-height-xs</span><span class="z-v" data-h></span></div><div class="z-line"><span class="z-btn" data-m style="height:var(--control-height-xs)">Save</span><span class="z-in" style="height:var(--control-height-xs)"></span></div></div><div class="z-item" data-density="comfortable"><div class="z-head"><span class="z-k">--control-height-sm</span><span class="z-v" data-h></span></div><div class="z-line"><span class="z-btn" data-m style="height:var(--control-height-sm)">Save</span><span class="z-in" style="height:var(--control-height-sm)"></span></div></div><div class="z-item" data-density="comfortable"><div class="z-head"><span class="z-k">--control-height-md</span><span class="z-v" data-h></span></div><div class="z-line"><span class="z-btn" data-m style="height:var(--control-height-md)">Save</span><span class="z-in" style="height:var(--control-height-md)"></span></div></div><div class="z-item" data-density="comfortable"><div class="z-head"><span class="z-k">--control-height-lg</span><span class="z-v" data-h></span></div><div class="z-line"><span class="z-btn" data-m style="height:var(--control-height-lg)">Save</span><span class="z-in" style="height:var(--control-height-lg)"></span></div></div></div><div><div class="z-h">compact</div><div class="z-item" data-density="compact"><div class="z-head"><span class="z-k">--control-height-xs</span><span class="z-v" data-h></span></div><div class="z-line"><span class="z-btn" data-m style="height:var(--control-height-xs)">Save</span><span class="z-in" style="height:var(--control-height-xs)"></span></div></div><div class="z-item" data-density="compact"><div class="z-head"><span class="z-k">--control-height-sm</span><span class="z-v" data-h></span></div><div class="z-line"><span class="z-btn" data-m style="height:var(--control-height-sm)">Save</span><span class="z-in" style="height:var(--control-height-sm)"></span></div></div><div class="z-item" data-density="compact"><div class="z-head"><span class="z-k">--control-height-md</span><span class="z-v" data-h></span></div><div class="z-line"><span class="z-btn" data-m style="height:var(--control-height-md)">Save</span><span class="z-in" style="height:var(--control-height-md)"></span></div></div><div class="z-item" data-density="compact"><div class="z-head"><span class="z-k">--control-height-lg</span><span class="z-v" data-h></span></div><div class="z-line"><span class="z-btn" data-m style="height:var(--control-height-lg)">Save</span><span class="z-in" style="height:var(--control-height-lg)"></span></div></div></div></div><script>
(function(){
document.querySelectorAll('[data-h]').forEach(function(v){var t=v.closest('[data-density]').querySelector('[data-m]');v.textContent=Math.round(t.getBoundingClientRect().height)+'px';});
document.querySelectorAll('[data-token]').forEach(function(v){var n=v.getAttribute('data-token');if(n)v.textContent=getComputedStyle(document.documentElement).getPropertyValue(n).trim();});
})();
</script></body></html>
