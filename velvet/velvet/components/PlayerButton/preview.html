<!-- @dsCard group="Components · Media" height=250 width=960 subtitle="The transparent control shared by VideoPlayer and AudioPlayer" -->
<!doctype html>
<html><head><meta charset="utf-8"><style>body{margin:0;padding:var(--space-5) 20px;box-sizing:border-box;background:var(--bg-raised);color:var(--fg-primary);font-family:var(--font-sans)}#root,.pane{background:transparent}.vcard+.vcard{margin-top:20px}.vcard-t{font:500 11px/1.3 var(--font-mono);color:var(--fg-tertiary);margin:0 0 8px}.lbl{font:600 10px/1.3 var(--font-sans);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-tertiary);margin-bottom:10px}
.pane{display:flex;flex-direction:column;gap:var(--space-5)}.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-5)}.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-5)}.r{display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center}</style></head><body>
<div class="vcard"><div id="root-0"></div></div>
<script>
(function(){
"use strict";
const NS = window.VelvetUIDesignSystem_ee2bd8;
const h = React.createElement;
const { PlayerButton } = NS;
const bar = { display: 'inline-flex', alignItems: 'center', gap: 'var(--space-1)', padding: 'var(--space-2)', borderRadius: 'var(--radius-md)', background: 'var(--bg-inverse)', color: 'var(--fg-inverse)', width: 'fit-content' };
const App = () => {
 const [playing, setPlaying] = React.useState(false);
 const [muted, setMuted] = React.useState(false);
 const [speed, setSpeed] = React.useState(1);
 return (h("div", { className: "pane" },
 h("div", null, h("div", { className: "lbl" }, "on a dark control bar"),
 h("div", { style: bar },
 h(PlayerButton, { icon: playing ? 'pause' : 'play', label: playing ? 'Pause' : 'Play', onClick: () => setPlaying(!playing) }),
 h(PlayerButton, { icon: 'skip-forward', label: 'Next' }),
 h(PlayerButton, { icon: 'volume', label: muted ? 'Unmute' : 'Mute', pressed: muted, onClick: () => setMuted(!muted) }),
 h(PlayerButton, { label: 'Speed ' + speed + '×', onClick: () => setSpeed(speed === 2 ? 1 : speed + 0.5) }, speed + '×'),
 h(PlayerButton, { icon: 'settings', label: 'Settings' }),
 h(PlayerButton, { icon: 'maximize', label: 'Full screen' }))),
 h("div", { className: "lbl" }, 'Icon, text or both · pressed state via aria-pressed · always give it a label')));
};
ReactDOM.createRoot(document.getElementById('root-0')).render(h(App, null));

})();
</script></body></html>
