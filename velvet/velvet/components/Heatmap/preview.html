<div class="vcard"><div id="root-0"></div></div>
<script>
(function(){
"use strict";
const NS = window.VelvetUIDesignSystem_ee2bd8;
const { Heatmap } = NS;
let s = 7;
const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
const mk = (days, end, f) => { const out = []; const e = new Date(end); for (let i = 0; i < days; i++) {
    const d = new Date(e.getFullYear(), e.getMonth(), e.getDate() - i);
    const wd = d.getDay();
    const base = (wd === 0 || wd === 6) ? .25 : 1;
    const v = rnd() < .18 ? 0 : Math.round(rnd() * f * base * (1 - i / days * .5));
    out.push({ date: d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'), value: v });
} return out; };
const A = mk(140, '2026-10-02', 12);
const B = mk(364, '2026-10-02', 6);
const App = () => { const [p, setP] = React.useState(null); return (React.createElement("div", { className: "pane" },
    React.createElement(Heatmap, { data: A, weeks: 20, unit: "sessions", label: "Last 20 weeks", onCellClick: setP }),
    React.createElement("div", { className: "lbl" }, p ? 'Selected ' + p.date + ' — ' + p.value + ' sessions' : 'Click a day to select it'),
    React.createElement(Heatmap, { data: B, weeks: 52, cellMax: 11, unit: "commits", label: "Last year", thresholds: [2, 4, 6] }))); };
ReactDOM.createRoot(document.getElementById('root-0')).render(React.createElement(App, null));

})();
</script></body></html>
