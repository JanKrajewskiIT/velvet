<div class="vcard"><div class="vcard-t">Input — affix &amp; counter — Prefix / suffix inside the focus ring; live character count</div><div id="root-0"></div></div>
<div class="vcard"><div class="vcard-t">Input — validation &amp; read-only — Validates on blur; fixed message lane, no reflow</div><div id="root-1"></div></div>
<div class="vcard"><div class="vcard-t">Input — Recipes: email · URL · prefix/suffix · error · disabled</div><div id="root-2"></div></div>
<script>
(function(){
"use strict";
const NS = window.VelvetUIDesignSystem_ee2bd8;
const { Input } = NS;
const App = () => {
    const [p, setP] = React.useState('24');
    const [slug, setSlug] = React.useState('velvet-studio');
    const n = parseFloat(p) || 0;
    return (React.createElement("div", { className: "pane" },
        React.createElement("div", { className: "g2" },
            React.createElement(Input, { label: "Seat price", prefix: "$", suffix: "USD / mo", inputMode: "decimal", value: p, onChange: e => setP(e.target.value.replace(/[^\d.]/g, '')), hint: '$' + (n * 12).toLocaleString('en') + ' per seat / year' }),
            React.createElement(Input, { label: "Workspace URL", prefix: "velvet.app/", value: slug, onChange: e => setSlug(e.target.value.toLowerCase().replace(/[^a-z0-9-]+/g, '-')), hint: "Lowercase letters, numbers and dashes." }),
            React.createElement("div", { style: { gridColumn: '1 / -1' } },
                React.createElement(Input, { label: "Bio", multiline: true, rows: 2, maxLength: 160, showCount: true, defaultValue: "Product designer at Velvet.", hint: "Markdown supported." })))));
};
ReactDOM.createRoot(document.getElementById('root-0')).render(React.createElement(App, null));

})();
(function(){
"use strict";
const NS = window.VelvetUIDesignSystem_ee2bd8;
const { Input } = NS;
const App = () => (React.createElement("div", { className: "pane" },
    React.createElement("div", { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 } },
        React.createElement(Input, { label: "Work email", placeholder: "name@company.com", iconLeft: "mail", validate: v => !v ? 'Email is required' : !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v) ? 'Enter a valid email address' : null }),
        React.createElement(Input, { label: "Workspace name", defaultValue: "Velvet Studio", reserveHint: true, hint: "Shown across your team." }),
        React.createElement(Input, { label: "Workspace ID", defaultValue: "ws_8b0036", readOnly: true, hint: "Focusable and selectable, not editable." }),
        React.createElement(Input, { label: "Primary domain", defaultValue: "velvet.design", disabled: true, hint: "Managed by your SSO provider." }))));
ReactDOM.createRoot(document.getElementById('root-1')).render(React.createElement(App, null));

})();
(function(){
"use strict";
const { Input } = window.VelvetUIDesignSystem_ee2bd8;
const isEmail = (v) => v && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v) ? 'Enter a valid email address' : undefined;
const isUrl = (v) => { if (!v)
    return; try {
    new URL(v.includes('://') ? v : 'https://' + v);
    return /\.[a-z]{2,}/i.test(v) ? undefined : 'Enter a valid URL';
}
catch (e) {
    return 'Enter a valid URL';
} };
const App = () => (React.createElement("div", { className: "pane" },
    React.createElement("div", { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '6px 14px', alignItems: 'start' } },
        React.createElement(Input, { label: "Email", type: "email", autoComplete: "email", placeholder: "you@company.com", iconLeft: "mail", validate: isEmail, hint: "type=email \u00B7 validate" }),
        React.createElement(Input, { label: "Website", type: "url", inputMode: "url", placeholder: "company.com", iconLeft: "globe", validate: isUrl, hint: "type=url \u00B7 validate" }),
        React.createElement(Input, { label: "Workspace URL", prefix: "velvet.app/", defaultValue: "acme", reserveHint: true }),
        React.createElement(Input, { label: "Price", prefix: "$", suffix: "USD / mo", defaultValue: "49", inputMode: "decimal", reserveHint: true }),
        React.createElement(Input, { label: "Workspace", defaultValue: "velvet", error: "This name is already taken" }),
        React.createElement(Input, { label: "Disabled", defaultValue: "Read only", disabled: true, reserveHint: true }))));
ReactDOM.createRoot(document.getElementById('root-2')).render(React.createElement(App, null));

})();
</script></body></html>
