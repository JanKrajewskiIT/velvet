<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.bundle.css"><link rel="stylesheet" href="card.css"><script src="../assets/theme-toggle.js"></script><script src="card.js"></script></head><body><div class="row" style="justify-content:space-between;margin-bottom:14px"><div class="vui-tabs vui-tabs--segmented" id="spd"><button class="vui-tab" data-s="1" aria-selected="false">×1</button><button class="vui-tab" data-s="4" aria-selected="true">×4</button><button class="vui-tab" data-s="10" aria-selected="false">×10</button></div><button class="vui-btn vui-btn--secondary vui-btn--sm" id="play"><i class="vui-icon icon-play"></i>Replay</button></div><div class="col" style="gap:8px"><div class="grid" style="grid-template-columns:40px minmax(0,1fr);gap:14px"><svg viewBox="-4 -24 48 72" width="40" height="52" style="flex:none;overflow:visible"><path d="M0 40 L40 40 M0 40 L0 0" stroke="var(--border-default)" fill="none"/><path d="M0 40 C0 40 40 0 40 0" stroke="var(--action-primary)" stroke-width="2" fill="none"/></svg><div class="grid" style="grid-template-columns:130px minmax(0,1fr) 70px;gap:12px"><span class="k">--ease-linear</span><div class="trk" style="position:relative;height:24px;border-radius:var(--radius-full);background:var(--bg-sunken)"><div class="dot" data-d="--dur-slow" data-e="--ease-linear" style="position:absolute;top:4px;left:4px;width:16px;height:16px;border-radius:50%;background:var(--action-primary)"></div></div><span class="v" style="text-align:right"></span></div></div><div class="grid" style="grid-template-columns:40px minmax(0,1fr);gap:14px"><svg viewBox="-4 -24 48 72" width="40" height="52" style="flex:none;overflow:visible"><path d="M0 40 L40 40 M0 40 L0 0" stroke="var(--border-default)" fill="none"/><path d="M0 40 C8 40 0 0 40 0" stroke="var(--action-primary)" stroke-width="2" fill="none"/></svg><div class="grid" style="grid-template-columns:130px minmax(0,1fr) 70px;gap:12px"><span class="k">--ease-standard</span><div class="trk" style="position:relative;height:24px;border-radius:var(--radius-full);background:var(--bg-sunken)"><div class="dot" data-d="--dur-slow" data-e="--ease-standard" style="position:absolute;top:4px;left:4px;width:16px;height:16px;border-radius:50%;background:var(--action-primary)"></div></div><span class="v" style="text-align:right"></span></div></div><div class="grid" style="grid-template-columns:40px minmax(0,1fr);gap:14px"><svg viewBox="-4 -24 48 72" width="40" height="52" style="flex:none;overflow:visible"><path d="M0 40 L40 40 M0 40 L0 0" stroke="var(--border-default)" fill="none"/><path d="M0 40 C12 40 0 0 40 0" stroke="var(--action-primary)" stroke-width="2" fill="none"/></svg><div class="grid" style="grid-template-columns:130px minmax(0,1fr) 70px;gap:12px"><span class="k">--ease-emphasized</span><div class="trk" style="position:relative;height:24px;border-radius:var(--radius-full);background:var(--bg-sunken)"><div class="dot" data-d="--dur-slow" data-e="--ease-emphasized" style="position:absolute;top:4px;left:4px;width:16px;height:16px;border-radius:50%;background:var(--action-primary)"></div></div><span class="v" style="text-align:right"></span></div></div><div class="grid" style="grid-template-columns:40px minmax(0,1fr);gap:14px"><svg viewBox="-4 -24 48 72" width="40" height="52" style="flex:none;overflow:visible"><path d="M0 40 L40 40 M0 40 L0 0" stroke="var(--border-default)" fill="none"/><path d="M0 40 C16 40 40 0 40 0" stroke="var(--action-primary)" stroke-width="2" fill="none"/></svg><div class="grid" style="grid-template-columns:130px minmax(0,1fr) 70px;gap:12px"><span class="k">--ease-exit</span><div class="trk" style="position:relative;height:24px;border-radius:var(--radius-full);background:var(--bg-sunken)"><div class="dot" data-d="--dur-slow" data-e="--ease-exit" style="position:absolute;top:4px;left:4px;width:16px;height:16px;border-radius:50%;background:var(--action-primary)"></div></div><span class="v" style="text-align:right"></span></div></div><div class="grid" style="grid-template-columns:40px minmax(0,1fr);gap:14px"><svg viewBox="-4 -24 48 72" width="40" height="52" style="flex:none;overflow:visible"><path d="M0 40 L40 40 M0 40 L0 0" stroke="var(--border-default)" fill="none"/><path d="M0 40 C13.600000000000001 -22.400000000000006 25.6 0 40 0" stroke="var(--action-primary)" stroke-width="2" fill="none"/></svg><div class="grid" style="grid-template-columns:130px minmax(0,1fr) 70px;gap:12px"><span class="k">--ease-spring</span><div class="trk" style="position:relative;height:24px;border-radius:var(--radius-full);background:var(--bg-sunken)"><div class="dot" data-d="--dur-slow" data-e="--ease-spring" style="position:absolute;top:4px;left:4px;width:16px;height:16px;border-radius:50%;background:var(--action-primary)"></div></div><span class="v" style="text-align:right"></span></div></div></div><script>let s=4,t;const dots=()=>[...document.querySelectorAll('.dot')];const ms=v=>{v=getComputedStyle(document.documentElement).getPropertyValue(v).trim();return v.endsWith('ms')?parseFloat(v):parseFloat(v)*1000};const ev=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const run=()=>{clearTimeout(t);let mx=0;dots().forEach(d=>{d.style.transition='none';d.style.left='4px'});void document.body.offsetWidth;dots().forEach(d=>{const dur=ms(d.dataset.d)*s;mx=Math.max(mx,dur);d.style.transition='left '+dur+'ms '+ev(d.dataset.e);d.style.left='calc(100% - 20px)'});t=setTimeout(run,mx+1200)};
document.getElementById('spd').onclick=e=>{const b=e.target.closest('[data-s]');if(!b)return;s=+b.dataset.s;document.querySelectorAll('#spd .vui-tab').forEach(x=>x.setAttribute('aria-selected',x===b));run()};document.getElementById('play').onclick=run;setTimeout(run,300);</script></body></html>
