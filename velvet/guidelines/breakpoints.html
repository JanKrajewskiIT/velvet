<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.bundle.css"><script src="../assets/theme-toggle.js"></script><style>body{margin:0;padding:20px;background:var(--bg-raised);font-family:var(--font-sans);color:var(--fg-primary)}.lbl{font:500 11px/1.3 var(--font-mono);color:var(--fg-tertiary)}.bp{display:grid;grid-template-columns:84px minmax(0,1fr) 56px;align-items:center;gap:12px}.bar{height:10px;border-radius:5px}.ctl{display:flex;align-items:center;gap:8px}.ctl div{width:80px;border:1px solid var(--border-strong);border-radius:8px}</style></head><body><div style="display:flex;flex-direction:column;gap:7px"><div class="bp"><span class="lbl">base · 0</span><div><div class="bar" style="width:23.4%;background:var(--velvet-100)"></div></div><span class="lbl" style="text-align:right">≥ 0</span></div><div class="bp"><span class="lbl">sm · 640</span><div><div class="bar" style="width:41.7%;background:var(--velvet-200)"></div></div><span class="lbl" style="text-align:right">≥ 640</span></div><div class="bp"><span class="lbl">md · 768</span><div><div class="bar" style="width:50.0%;background:var(--velvet-300)"></div></div><span class="lbl" style="text-align:right">≥ 768</span></div><div class="bp"><span class="lbl">lg · 1024</span><div><div class="bar" style="width:66.7%;background:var(--velvet-400)"></div></div><span class="lbl" style="text-align:right">≥ 1024</span></div><div class="bp"><span class="lbl">xl · 1280</span><div><div class="bar" style="width:83.3%;background:var(--velvet-500)"></div></div><span class="lbl" style="text-align:right">≥ 1280</span></div><div class="bp"><span class="lbl">2xl · 1536</span><div><div class="bar" style="width:100.0%;background:var(--velvet-700)"></div></div><span class="lbl" style="text-align:right">≥ 1536</span></div></div>
<div style="display:flex;gap:20px;align-items:flex-end;margin-top:16px"><div class="ctl"><div style="height:var(--control-height-sm)"></div><span class="lbl">control-sm</span></div><div class="ctl"><div style="height:var(--control-height-md)"></div><span class="lbl">control-md</span></div><div class="ctl"><div style="height:var(--control-height-lg)"></div><span class="lbl">control-lg</span></div><span class="lbl" style="margin-left:auto">touch: md → 44px</span></div></body></html>
