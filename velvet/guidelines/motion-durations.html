<!-- @dsCard group="09 Motion" viewport="960x260" name="Durations" subtitle="--dur-* · slowed to compare" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.bundle.css"><link rel="stylesheet" href="card.css"><script src="../assets/theme-toggle.js"></script><script src="card.js"></script></head><body><div class="row" style="justify-content:space-between;margin-bottom:14px"><div class="vui-tabs vui-tabs--segmented" id="spd"><button class="vui-tab" data-s="1" aria-selected="false">×1</button><button class="vui-tab" data-s="4" aria-selected="true">×4</button><button class="vui-tab" data-s="10" aria-selected="false">×10</button></div><button class="vui-btn vui-btn--secondary vui-btn--sm" id="play"><i class="vui-icon icon-play"></i>Replay</button></div><div class="col" style="gap:10px"><div class="grid" style="grid-template-columns:130px minmax(0,1fr) 70px;gap:12px"><span class="k">--dur-instant</span><div class="trk" style="position:relative;height:24px;border-radius:var(--radius-full);background:var(--bg-sunken)"><div class="dot" data-d="--dur-instant" data-e="--ease-standard" style="position:absolute;top:4px;left:4px;width:16px;height:16px;border-radius:50%;background:var(--action-primary)"></div></div><span class="v" style="text-align:right" data-token="--dur-instant"></span></div><div class="grid" style="grid-template-columns:130px minmax(0,1fr) 70px;gap:12px"><span class="k">--dur-fast</span><div class="trk" style="position:relative;height:24px;border-radius:var(--radius-full);background:var(--bg-sunken)"><div class="dot" data-d="--dur-fast" data-e="--ease-standard" style="position:absolute;top:4px;left:4px;width:16px;height:16px;border-radius:50%;background:var(--action-primary)"></div></div><span class="v" style="text-align:right" data-token="--dur-fast"></span></div><div class="grid" style="grid-template-columns:130px minmax(0,1fr) 70px;gap:12px"><span class="k">--dur-base</span><div class="trk" style="position:relative;height:24px;border-radius:var(--radius-full);background:var(--bg-sunken)"><div class="dot" data-d="--dur-base" data-e="--ease-standard" style="position:absolute;top:4px;left:4px;width:16px;height:16px;border-radius:50%;background:var(--action-primary)"></div></div><span class="v" style="text-align:right" data-token="--dur-base"></span></div><div class="grid" style="grid-template-columns:130px minmax(0,1fr) 70px;gap:12px"><span class="k">--dur-slow</span><div class="trk" style="position:relative;height:24px;border-radius:var(--radius-full);background:var(--bg-sunken)"><div class="dot" data-d="--dur-slow" data-e="--ease-standard" style="position:absolute;top:4px;left:4px;width:16px;height:16px;border-radius:50%;background:var(--action-primary)"></div></div><span class="v" style="text-align:right" data-token="--dur-slow"></span></div><div class="grid" style="grid-template-columns:130px minmax(0,1fr) 70px;gap:12px"><span class="k">--dur-slower</span><div class="trk" style="position:relative;height:24px;border-radius:var(--radius-full);background:var(--bg-sunken)"><div class="dot" data-d="--dur-slower" data-e="--ease-standard" style="position:absolute;top:4px;left:4px;width:16px;height:16px;border-radius:50%;background:var(--action-primary)"></div></div><span class="v" style="text-align:right" data-token="--dur-slower"></span></div></div><script>let s=4,t;const dots=()=>[...document.querySelectorAll('.dot')];const ms=v=>{v=getComputedStyle(document.documentElement).getPropertyValue(v).trim();return v.endsWith('ms')?parseFloat(v):parseFloat(v)*1000};const ev=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const run=()=>{clearTimeout(t);let mx=0;dots().forEach(d=>{d.style.transition='none';d.style.left='4px'});void document.body.offsetWidth;dots().forEach(d=>{const dur=ms(d.dataset.d)*s;mx=Math.max(mx,dur);d.style.transition='left '+dur+'ms '+ev(d.dataset.e);d.style.left='calc(100% - 20px)'});t=setTimeout(run,mx+1200)};
document.getElementById('spd').onclick=e=>{const b=e.target.closest('[data-s]');if(!b)return;s=+b.dataset.s;document.querySelectorAll('#spd .vui-tab').forEach(x=>x.setAttribute('aria-selected',x===b));run()};document.getElementById('play').onclick=run;setTimeout(run,300);</script></body></html>
