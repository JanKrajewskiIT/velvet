<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.bundle.css"><script src="../assets/theme-toggle.js"></script><style>body{margin:0;padding:20px;background:var(--bg-raised);font-family:var(--font-sans);color:var(--fg-primary)}.m{font:500 10px/1.3 var(--font-mono);color:var(--fg-tertiary)}.m b{color:var(--fg-primary);font-weight:500;margin-right:6px}.wf{border:1px dashed var(--border-strong);border-radius:var(--radius-md);overflow:hidden;background:var(--bg-subtle)}.top{height:calc(var(--topbar-height) * .8);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px;background:var(--bg-raised);border-bottom:1px solid var(--border-default);font:600 12px/1 var(--font-sans)}.body{display:grid;grid-template-columns:calc(var(--sidebar-width) * .6) minmax(0,1fr);min-height:220px}.side{position:relative;display:flex;flex-direction:column;gap:6px;padding:12px;background:var(--bg-raised);border-right:1px dashed var(--border-strong)}.side i{display:block;height:10px;border-radius:3px;background:var(--bg-sunken)}.side i.on{background:var(--bg-selected)}.side .m{position:absolute;left:12px;bottom:10px}.main{padding:16px var(--gutter);display:flex;flex-direction:column;gap:12px}.cont{position:relative;border:1px dashed var(--border-brand);border-radius:var(--radius-sm);padding:28px 12px 12px;background:var(--bg-selected)}.cont>.m{position:absolute;top:8px;left:12px;color:var(--fg-brand)}.grid{display:grid;grid-template-columns:repeat(var(--grid-columns),minmax(0,1fr));gap:8px;height:90px}.grid span{border-radius:3px;background:color-mix(in oklch,var(--action-primary) 14%,transparent)}.foot{display:flex;flex-wrap:wrap;gap:8px 20px;padding:10px 16px;border-top:1px dashed var(--border-strong);background:var(--bg-raised)}</style></head><body>
<div class="wf"><div class="top"><span>Topbar</span><span class="m"><b>--topbar-height</b>60px</span></div><div class="body"><div class="side"><i class="on"></i><i></i><i></i><i style="width:70%"></i><span class="m"><b>--sidebar-width</b>248 / 64</span></div><div class="main"><div class="cont"><span class="m">container · --container-xl 1280 · padding --gutter</span><div class="grid"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div></div></div></div>
<div class="foot"><span class="m"><b>--grid-columns</b>12</span><span class="m"><b>--grid-gap</b>24 (sm 16)</span><span class="m"><b>--gutter</b>clamp(16, 4vw, 32)</span><span class="m"><b>--section-gap</b>48→96</span><span class="m"><b>--content-gap</b>24</span><span class="m"><b>--stack-gap</b>16</span></div></div></body></html>
