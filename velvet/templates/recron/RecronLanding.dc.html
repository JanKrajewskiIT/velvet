<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script><script src="./recron-data.js"></script><style>:root:root{overflow:auto!important;height:auto!important;background:var(--bg-page)!important}html body{margin:0!important;padding:0!important;background:var(--bg-page)!important}@keyframes recronRise{from{opacity:0;transform:translateY(24px);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}@keyframes recronGrid{from{opacity:0;transform:scale(1.12)}to{opacity:1;transform:none}}@keyframes recronLogo{from{opacity:0;transform:translateY(-12px) scale(.92);filter:blur(12px)}to{opacity:1;transform:none;filter:blur(0)}}@keyframes recronCard{from{opacity:0;transform:translateY(40px) rotateX(18deg) scale(.94);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}@keyframes recronSweep{from{transform:translateX(-120%) skewX(-18deg)}to{transform:translateX(220%) skewX(-18deg)}}@media (prefers-reduced-motion:reduce){[data-recron-anim],[data-recron-anim] *{animation:none!important}}@media (max-width:960px){[data-recron-body]{grid-template-columns:minmax(0,1fr)!important;gap:var(--space-10)!important;justify-items:center}[data-recron-intro]{align-items:center;text-align:center}[data-recron-cta]{justify-content:center}[data-recron-cards]{width:100%;max-width:448px}}@media (max-width:520px){[data-recron-cards]{grid-template-columns:minmax(0,1fr)!important;max-width:352px}}</style></helmet>
<section data-screen-label="Landing" style="position:relative;display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 64px);box-sizing:border-box;overflow:hidden;padding:var(--space-12) var(--space-6);background:var(--bg-page);color:var(--fg-primary);font-family:var(--font-sans)">
<div aria-hidden="true" style="position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(color-mix(in oklab,var(--fg-primary) 8%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in oklab,var(--fg-primary) 8%,transparent) 1px,transparent 1px);background-size:64px 64px;-webkit-mask-image:radial-gradient(ellipse 75% 65% at 50% 45%,#000 15%,transparent 75%);mask-image:radial-gradient(ellipse 75% 65% at 50% 45%,#000 15%,transparent 75%);animation:recronGrid 1400ms cubic-bezier(.16,1,.3,1) both" data-recron-anim=""></div>
<div style="position:relative;z-index:1;display:flex;flex-direction:column;gap:var(--space-10);width:100%;max-width:1088px">
<div data-recron-anim="" style="display:flex;justify-content:center;animation:recronLogo 900ms cubic-bezier(.16,1,.3,1) 50ms both"><x-import component-from-global-scope="VelvetUIDesignSystem_ee2bd8.BrandLogo" brand="recron" size="{{ 48 }}" hint-size="214px,48px"></x-import></div>
<div data-recron-body="" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-16);align-items:center">
<div data-recron-intro="" style="display:flex;flex-direction:column;gap:var(--space-6);min-width:0">
<h1 data-recron-anim="" style="animation:recronRise 900ms cubic-bezier(.16,1,.3,1) 250ms both;margin:0;font:var(--type-heavy-weight) clamp(32px,5vw,48px)/1.08 var(--font-display);letter-spacing:-.02em;text-wrap:balance">Stop juggling tabs. <span style="color:var(--fg-brand)">Start landing offers.</span></h1>
<p data-recron-anim="" style="animation:recronRise 900ms cubic-bezier(.16,1,.3,1) 400ms both;margin:0;max-width:52ch;font-size:var(--type-body-size);line-height:1.6;color:var(--fg-secondary);text-wrap:pretty">Recron brings offer tracking, interview prep, CV building, and AI tools into one focused workspace — so you move faster from first lead to signed contract.</p>
<div data-recron-cta="" data-recron-anim="" style="animation:recronRise 900ms cubic-bezier(.16,1,.3,1) 550ms both;display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-3);margin-top:var(--space-2)">
<x-import component-from-global-scope="VelvetUIDesignSystem_ee2bd8.Button" size="lg" icon-right="arrow-right" on-click="{{ start }}" hint-size="160px,48px">Get started</x-import>
<span style="font-size:var(--type-caption-size);color:var(--fg-tertiary)">Free · sign in with LinkedIn</span>
</div>
</div>
<div data-recron-cards="" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-3);min-width:0;perspective:1200px">
<div data-recron-anim="" style="position:relative;display:flex;flex-direction:column;min-width:0;transform-origin:50% 100%;animation:recronCard 1000ms cubic-bezier(.16,1,.3,1) 450ms both"><x-import component-from-global-scope="VelvetUIDesignSystem_ee2bd8.FeatureCard" look="lift" tone="brand" icon="briefcase" title="Offer Organizer" description="Track job offers, manage statuses, schedule interviews and sync with Google Calendar." style="flex:1" hint-size="100%,180px"></x-import><div aria-hidden="true" style="position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:var(--radius-lg,16px)"><div style="position:absolute;top:0;bottom:0;left:0;width:40%;background:linear-gradient(90deg,transparent,color-mix(in oklab,white 22%,transparent),transparent);animation:recronSweep 1100ms ease-out 1100ms both"></div></div></div>
<div data-recron-anim="" style="position:relative;display:flex;flex-direction:column;min-width:0;transform-origin:50% 100%;animation:recronCard 1000ms cubic-bezier(.16,1,.3,1) 570ms both"><x-import component-from-global-scope="VelvetUIDesignSystem_ee2bd8.FeatureCard" look="lift" tone="success" icon="book-open" title="Interview Questions" description="Browse technical questions with answers, build a learning deck and test yourself with flashcard quizzes." style="flex:1" hint-size="100%,180px"></x-import><div aria-hidden="true" style="position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:var(--radius-lg,16px)"><div style="position:absolute;top:0;bottom:0;left:0;width:40%;background:linear-gradient(90deg,transparent,color-mix(in oklab,white 22%,transparent),transparent);animation:recronSweep 1100ms ease-out 1220ms both"></div></div></div>
<div data-recron-anim="" style="position:relative;display:flex;flex-direction:column;min-width:0;transform-origin:50% 100%;animation:recronCard 1000ms cubic-bezier(.16,1,.3,1) 690ms both"><x-import component-from-global-scope="VelvetUIDesignSystem_ee2bd8.FeatureCard" look="lift" tone="warning" icon="file-text" title="CV Builder" description="Build your CV, preview in 3 templates and export to PDF, HTML or JSON." style="flex:1" hint-size="100%,180px"></x-import><div aria-hidden="true" style="position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:var(--radius-lg,16px)"><div style="position:absolute;top:0;bottom:0;left:0;width:40%;background:linear-gradient(90deg,transparent,color-mix(in oklab,white 22%,transparent),transparent);animation:recronSweep 1100ms ease-out 1340ms both"></div></div></div>
<div data-recron-anim="" style="position:relative;display:flex;flex-direction:column;min-width:0;transform-origin:50% 100%;animation:recronCard 1000ms cubic-bezier(.16,1,.3,1) 810ms both"><x-import component-from-global-scope="VelvetUIDesignSystem_ee2bd8.FeatureCard" look="lift" tone="info" icon="sparkles" title="AI Tools" description="Parse offers, match your CV, generate cover letters and get AI-powered answers to interview questions." style="flex:1" hint-size="100%,180px"></x-import><div aria-hidden="true" style="position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:var(--radius-lg,16px)"><div style="position:absolute;top:0;bottom:0;left:0;width:40%;background:linear-gradient(90deg,transparent,color-mix(in oklab,white 22%,transparent),transparent);animation:recronSweep 1100ms ease-out 1460ms both"></div></div></div>
</div>
</div>
</div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const app = this.props.app;
    return { start: () => (app ? app.signIn() : (location.href = './Recron.dc.html')) };
  }
}
</script>
</body>
</html>
