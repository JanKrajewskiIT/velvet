<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script><script src="./recron-data.js"></script><style>:root:root{overflow:auto!important;height:auto!important;background:var(--bg-page)!important}html body{margin:0!important;padding:0!important;background:var(--bg-page)!important}</style></helmet>
<div style="display:flex;flex-direction:column;gap:var(--space-4)">
<x-import component-from-global-scope="VelvetUIDesignSystem_ee2bd8.PageHeader" title="Pipeline" description="Every offer you’re tracking, from first look to final answer." actions="{{ headerActions }}" hint-size="100%,112px"></x-import>
<div style="display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-3)">
<div style="flex:1 1 240px;max-width:320px">
<x-import component-from-global-scope="VelvetUIDesignSystem_ee2bd8.SearchInput" size="sm" placeholder="Search role or company…" value="{{ query }}" on-value-change="{{ setQuery }}" aria-label="Search offers" hint-size="100%,36px"></x-import>
</div>
<x-import component-from-global-scope="VelvetUIDesignSystem_ee2bd8.ChipGroup" size="sm" label="Filter by status" options="{{ statusOptions }}" value="{{ statuses }}" on-value-change="{{ setStatuses }}" hint-size="420px,32px"></x-import>
<x-import component-from-global-scope="VelvetUIDesignSystem_ee2bd8.ChipGroup" size="sm" label="Filter by tag" options="{{ tagOptions }}" value="{{ tagFilter }}" on-value-change="{{ setTagFilter }}" hint-size="420px,32px"></x-import>
<div style="flex:1"></div>
<x-import component-from-global-scope="VelvetUIDesignSystem_ee2bd8.OptionSwitcher" size="sm" label="View" icon-only="{{ true }}" options="{{ viewOptions }}" value="{{ view }}" on-value-change="{{ setView }}" hint-size="76px,32px"></x-import>
</div>
<sc-if value="{{ isTable }}" hint-placeholder-val="{{ true }}">
<x-import component-from-global-scope="VelvetUIDesignSystem_ee2bd8.Card" padding="none" style="min-width:0" hint-size="100%,520px">
<x-import component-from-global-scope="VelvetUIDesignSystem_ee2bd8.Table" layout="fixed" columns="{{ columns }}" rows="{{ rows }}" selectable="{{ compare }}" selected="{{ selected }}" on-selected-change="{{ setSelected }}" default-sort="{{ defaultSort }}" empty="{{ empty }}" hint-size="100%,500px"></x-import>
</x-import>
</sc-if>
<sc-if value="{{ isBoard }}" hint-placeholder-val="{{ false }}">
<x-import component-from-global-scope="VelvetUIDesignSystem_ee2bd8.Kanban" columns="{{ kanbanColumns }}" cards="{{ kanbanCards }}" on-cards-change="{{ onCardsChange }}" on-card-click="{{ onCardClick }}" on-add-card="{{ onAddCard }}" hint-size="100%,560px"></x-import>
</sc-if>
<sc-if value="{{ compare }}" hint-placeholder-val="{{ false }}">
<x-import component-from-global-scope="VelvetUIDesignSystem_ee2bd8.ComparisonBar" items="{{ compareItems }}" min="{{ 2 }}" max="{{ 4 }}" noun="{{ noun }}" on-remove="{{ removeCompare }}" on-clear="{{ clearCompare }}" on-compare="{{ openCompare }}" hint-size="0,0"></x-import>
</sc-if>
<x-import component-from-global-scope="VelvetUIDesignSystem_ee2bd8.ComparisonDialog" open="{{ compareOpen }}" on-close="{{ closeCompare }}" title="Compare offers" description="Salary normalised to monthly PLN. Stars mark the best value in each row." items="{{ compareItems }}" axes="{{ axes }}" rows="{{ compareRows }}" insights="{{ insights }}" on-generate-insights="{{ genInsights }}" insights-status="{{ insightsStatus }}" hint-size="0,0"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { query: '', statuses: [], tagFilter: [], view: 'table', compare: false, selected: [], compareOpen: false, insights: null, insightsStatus: 'idle' };
  renderVals() {
    const app = this.props.app || (window.RecronStandalone && window.VelvetUIDesignSystem_ee2bd8 && window.RecronStandalone(this));
    if (!app) { clearTimeout(this._wt); this._wt = setTimeout(() => this.forceUpdate(), 80); return {}; }
    const { D, U, NS, offers, interviews } = app;
    const h = React.createElement;
    const s = this.state;
    const counts = {}; offers.forEach((o) => { counts[o.status] = (counts[o.status] || 0) + 1; });
    const q = s.query.trim().toLowerCase();
    const rows = offers.filter((o) => (!s.statuses.length || s.statuses.includes(o.status)) && (!s.tagFilter.length || s.tagFilter.some((x) => o.tags.includes(x))) && (!q || (o.name + ' ' + o.company + ' ' + o.city).toLowerCase().includes(q)));
    const nextOf = (id) => interviews.filter((i) => i.offerId === id && i.status === 'scheduled' && new Date(i.at) >= D.TODAY).sort((a, b) => new Date(a.at) - new Date(b.at))[0];
    const lastStage = (id) => { const l = interviews.filter((i) => i.offerId === id && i.status === 'done').sort((a, b) => new Date(b.at) - new Date(a.at))[0]; return l && l.stage; };
    const statusBadge = (st) => h(NS.Badge, { tone: D.STATUS[st].tone, dot: true }, D.STATUS[st].label);
    const roleCell = (o) => h('button', { type: 'button', onClick: () => app.openOffer(o.id), style: { width: '100%', minWidth: 0, display: 'flex', alignItems: 'center', gap: 'var(--space-3)', padding: 0, border: 0, background: 'none', font: 'inherit', color: 'inherit', textAlign: 'left', cursor: 'pointer', minWidth: 0 } },
      h(NS.Avatar, { name: o.company, color: 'auto', size: 'sm' }),
      h('span', { style: { display: 'flex', flexDirection: 'column', minWidth: 0, flex: 1 } },
        h('span', { style: { fontWeight: 'var(--type-title-weight)', color: 'var(--fg-primary)', textWrap: 'pretty' } }, o.name),
        h('span', { style: { display: 'flex', alignItems: 'center', minWidth: 0, gap: 'var(--space-2)', fontSize: 'var(--type-caption-size)', color: 'var(--fg-secondary)' } }, h('span', { title: o.intermediary ? 'via ' + o.intermediary : undefined, style: { minWidth: 0, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' } }, o.company + ' · ' + (o.workMode === 'Remote' ? 'Remote' : o.city + ' · ' + o.workMode) + (o.intermediary ? ' · via ' + o.intermediary : '')),
          o.tags.length ? h('span', { title: o.tags.join(', '), style: { display: 'inline-flex', flex: 'none', gap: 3 } }, o.tags.map((x) => h('span', { key: x, style: { width: 8, height: 8, borderRadius: '50%', background: U.tagColor(app.tags, x) } }))) : null)));
    const matchCell = (o) => o.match == null ? h('span', { style: { color: 'var(--fg-tertiary)', fontSize: 'var(--type-caption-size)' } }, 'Not run')
      : h('span', { style: { display: 'inline-flex', alignItems: 'center', gap: 'var(--space-2)', minWidth: 0, width: '100%' } }, h(NS.Meter, { value: o.match, size: 'sm', tone: o.match >= 75 ? 'success' : o.match >= 50 ? 'warning' : 'danger', style: { width: 48 } }), h('span', { style: { fontVariantNumeric: 'tabular-nums' } }, o.match + '%'));
    const nextCell = (o) => { const n = nextOf(o.id); if (n) return h('span', { style: { display: 'flex', flexDirection: 'column' } }, h('span', null, n.stage), h('span', { style: { fontSize: 'var(--type-caption-size)', color: 'var(--fg-secondary)' } }, U.relDay(n.at) + ', ' + U.fmtTime(n.at))); const l = lastStage(o.id); return h('span', { style: { color: 'var(--fg-tertiary)' } }, l ? l + ' done' : '—'); };
    const rowMenu = (o) => h('span', { style: { display: 'inline-flex', paddingRight: 'var(--space-2)' } }, h(NS.Menu, { align: 'end', iconPosition: 'end', width: 220, trigger: h(NS.IconButton, { icon: 'more-horizontal', label: 'Actions for ' + o.name, size: 'sm' }), items: [
      { label: 'Open', icon: 'arrow-up-right', onSelect: () => app.openOffer(o.id) },
      { label: 'Edit', icon: 'pencil', onSelect: () => app.editOffer(o.id) },
      { label: 'Duplicate', icon: 'copy', onSelect: () => app.duplicateOffer(o.id) },
      { label: 'Edit tags', icon: 'tag', onSelect: () => app.openTags && app.openTags(o.id) },
      { label: 'Run CV match', icon: 'sparkles', onSelect: () => app.openOffer(o.id, 'match') },
      { section: 'Move to' },
      ...D.STATUS_ORDER.map((st) => ({ label: D.STATUS[st].label, checked: o.status === st, onSelect: () => app.decide(o.id, st) })),
      { divider: true },
      { label: 'Delete', icon: 'trash-2', danger: true, onSelect: () => app.removeOffer(o.id) }
    ] }));
    const sel = offers.filter((o) => s.selected.includes(o.id));
    const maxSalary = Math.max(1, ...sel.map((o) => U.monthly(o) || 0));
    const stageIdx = (o) => { const l = lastStage(o.id); return l ? (D.STAGES.indexOf(l) + 1) * 20 : o.status === 'applied' ? 10 : 0; };
    const compareItems = sel.map((o) => ({ id: o.id, label: o.company, description: o.name, score: o.match != null ? o.match + '%' : undefined, scores: { pay: Math.round(((U.monthly(o) || 0) / maxSalary) * 100), match: o.match ?? 0, remote: o.workMode === 'Remote' ? 100 : o.workMode === 'Hybrid' ? 50 : 0, stage: stageIdx(o) } }));
    const setSelected = (k) => this.setState({ selected: k.slice(0, 4) });
    return {
      headerActions: h(React.Fragment, null,
        h(NS.Button, { variant: s.compare ? 'soft' : 'secondary', iconLeft: 'layers', 'aria-pressed': s.compare, onClick: () => this.setState({ compare: !s.compare, selected: [], view: 'table' }) }, s.compare ? 'Done comparing' : 'Compare'),
        app.manageTags ? h(NS.Button, { variant: 'secondary', iconLeft: 'tag', onClick: app.manageTags }, 'Tags') : null,
        h(NS.Button, { iconLeft: 'plus', onClick: app.openAdd }, 'Add offer')),
      query: s.query, setQuery: (v) => this.setState({ query: v }),
      statusOptions: D.STATUS_ORDER.map((st) => ({ value: st, label: D.STATUS[st].label, count: counts[st] || 0 })),
      statuses: s.statuses, setStatuses: (v) => this.setState({ statuses: v }),
      tagOptions: app.tags.filter((tg) => offers.some((o) => o.tags.includes(tg.name))).map((tg) => ({ value: tg.name, count: offers.filter((o) => o.tags.includes(tg.name)).length, label: h('span', { style: { display: 'inline-flex', alignItems: 'center', gap: 6 } }, h('span', { style: { width: 8, height: 8, borderRadius: '50%', background: tg.color } }), tg.name) })),
      tagFilter: s.tagFilter, setTagFilter: (v) => this.setState({ tagFilter: v }),
      viewOptions: [{ value: 'table', label: 'Table', icon: 'list' }, { value: 'board', label: 'Board', icon: 'kanban' }],
      view: s.view, setView: (v) => this.setState({ view: v, compare: v === 'board' ? false : s.compare }),
      isTable: s.view === 'table', isBoard: s.view === 'board',
      defaultSort: { key: 'added', dir: 'desc' },
      columns: [
        { key: 'name', label: 'Role', render: roleCell, sortable: true, sortValue: (o) => o.name },
        { key: 'status', label: 'Status', width: 150, render: (o) => (o.reasons || []).length && o.status !== 'new' ? h('span', { style: { display: 'flex', flexDirection: 'column', alignItems: 'flex-start', gap: 2 } }, statusBadge(o.status), h('span', { title: o.reasons.join(' · '), style: { fontSize: 'var(--type-caption-size)', color: 'var(--fg-tertiary)', display: 'block', maxWidth: '100%', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' } }, o.reasons[0] + (o.reasons.length > 1 ? ' +' + (o.reasons.length - 1) : ''))) : statusBadge(o.status), sortable: true, sortValue: (o) => D.STATUS_ORDER.indexOf(o.status) },
        { key: 'salary', label: 'Salary', width: 132, render: (o) => { const s = U.salary(o); const k = s.lastIndexOf(' '); return k < 0 ? s : h('span', { style: { display: 'flex', flexDirection: 'column', whiteSpace: 'nowrap' } }, h('span', { style: { fontVariantNumeric: 'tabular-nums' } }, s.slice(0, k)), h('span', { style: { fontSize: 'var(--type-caption-size)', color: 'var(--fg-tertiary)' } }, s.slice(k + 1))); }, sortable: true, sortValue: (o) => U.monthly(o) || 0, hideOnMobile: true },
        { key: 'match', label: 'CV match', width: 120, render: matchCell, sortable: true, sortValue: (o) => o.match ?? -1, hideOnMobile: true },
        { key: 'added', label: 'Added', width: 104, render: (o) => h('span', { style: { whiteSpace: 'nowrap' } }, U.relDay(o.added)), sortable: true, sortValue: (o) => o.added, hideOnMobile: true },
        { key: 'menu', label: h('span', { className: 'vui-sr-only' }, 'Actions'), render: rowMenu, width: 56, align: 'right' }
      ],
      rows, compare: s.compare, selected: s.selected, setSelected,
      empty: offers.length ? h(NS.EmptyState, { size: 'sm', icon: 'search', title: 'No offers match', description: 'Try another status or search.', actions: h(NS.Button, { size: 'sm', variant: 'secondary', onClick: () => this.setState({ query: '', statuses: [], tagFilter: [] }) }, 'Clear filters') })
        : h(NS.EmptyState, { size: 'md', icon: 'briefcase', title: 'Track your first offer', description: 'Paste a link from LinkedIn, JustJoin.it or any job board — Recron reads it and fills in the details.', actions: h(NS.Button, { size: 'sm', iconLeft: 'plus', onClick: app.openAdd }, 'Add offer') }),
      kanbanColumns: D.STATUS_ORDER.map((st) => ({ id: st, title: D.STATUS[st].label, color: D.STATUS[st].color })),
      kanbanCards: rows.map((o) => ({ id: o.id, column: o.status, title: o.name, tag: o.workMode, tagTone: o.workMode === 'Remote' ? 'success' : 'neutral', meta: o.company + ' · ' + U.salary(o), assignee: h(NS.Avatar, { name: o.company, color: 'auto', size: 'xs' }) })),
      onCardsChange: (cards) => { const moved = cards.find((c) => { const o = offers.find((x) => x.id === c.id); return o && o.status !== c.column; }); if (moved) app.decide(moved.id, moved.column); },
      onCardClick: (c) => app.openOffer(c.id),
      onAddCard: app.openAdd,
      compareItems, noun: ['offer', 'offers'],
      removeCompare: (id) => this.setState({ selected: s.selected.filter((x) => x !== id) }),
      clearCompare: () => this.setState({ selected: [] }),
      openCompare: () => this.setState({ compareOpen: true, insights: null, insightsStatus: 'idle' }),
      compareOpen: s.compareOpen, closeCompare: () => this.setState({ compareOpen: false }),
      axes: [{ key: 'pay', label: 'Salary' }, { key: 'match', label: 'CV match' }, { key: 'remote', label: 'Remote' }, { key: 'stage', label: 'Progress' }],
      compareRows: [
        { label: 'Salary', hint: 'monthly, upper bound', values: sel.map((o) => U.monthly(o)), best: 'max', format: (v) => (v == null ? '—' : U.fmtNum(v) + ' PLN') },
        { label: 'CV match', values: sel.map((o) => o.match), best: 'max', format: (v) => (v == null ? 'Not run' : v + '%') },
        { label: 'Work mode', values: sel.map((o) => o.workMode) },
        { label: 'Location', values: sel.map((o) => o.city) },
        { label: 'Stage reached', values: sel.map((o) => lastStage(o.id) || D.STATUS[o.status].label) },
        { label: 'Source', values: sel.map((o) => o.source) }
      ],
      insights: s.insights ? h(NS.Markdown, { size: 'sm', source: s.insights }) : null,
      insightsStatus: s.insightsStatus,
      genInsights: () => { this.setState({ insightsStatus: 'loading' }); setTimeout(() => { const best = [...sel].sort((a, b) => (b.match ?? 0) - (a.match ?? 0))[0]; this.setState({ insightsStatus: 'idle', insights: '**' + (best ? best.company : '') + '** is the strongest overall: best CV match and a clear path to the final round.\n\n- Highest pay: **' + ([...sel].sort((a, b) => (U.monthly(b) || 0) - (U.monthly(a) || 0))[0] || {}).company + '**\n- If remote matters most, drop on-site roles first\n- Ask each company about the team size before the HR round' }); }, 1400); }
    };
  }
}
</script>
</body>
</html>
