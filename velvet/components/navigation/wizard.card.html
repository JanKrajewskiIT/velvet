<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.bundle.css"><script src="../../assets/theme-toggle.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>.pane{display:flex;flex-direction:column;gap:14px}.r{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}</style>
<link rel="stylesheet" href="../card.css"></head><body><div id="root"></div>
<script type="text/babel">
const NS = window.VelvetUIDesignSystem_ee2bd8;
const { Wizard, Input, OptionSwitcher } = NS;
const App=()=>{const[name,setName]=React.useState('');const[done,setDone]=React.useState(false);
if(done)return(<div className="pane" style={{placeItems:'center',display:'grid',textAlign:'center'}}><div><div style={{fontFamily:'var(--font-display)',fontSize:22,fontWeight:600}}>Workspace created</div><div className="lbl" style={{marginTop:6}}>{name} is ready.</div></div></div>);
return(<div className="pane"><Wizard onFinish={()=>new Promise(r=>setTimeout(()=>{setDone(true);r();},900))} finishLabel="Create workspace" steps={[
{label:'Account details',content:<Input label="Workspace name" value={name} onChange={e=>setName(e.target.value)} placeholder="e.g. Velvet Studio" />,validate:()=>!name.trim()&&'Give your workspace a name to continue.'},
{label:'Profile',content:<div style={{display:'flex',flexDirection:'column',gap:8}}><span className="vui-label">Team size</span><OptionSwitcher options={['1–5','6–20','21–100','100+']} defaultValue="6–20" /></div>},
{label:'Review & finish',content:<div style={{fontSize:14,color:'var(--fg-secondary)'}}>Everything looks good — confirm to create <b style={{color:'var(--fg-primary)'}}>{name||'your workspace'}</b>.</div>}]} /></div>);};
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
