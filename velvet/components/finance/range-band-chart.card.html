<link rel="stylesheet" href="../card.css"></head><body><div id="root"></div>
<script type="text/babel">
const { RangeBandChart } = window.VelvetUIDesignSystem_ee2bd8;
const data=Array.from({length:29},(_,i)=>{const mu=i*0.16,sd=Math.sqrt(i)*0.55;return{label:'D'+i,lo:+(mu-1.64*sd).toFixed(2),mid:+mu.toFixed(2),hi:+(mu+1.64*sd).toFixed(2),value:+(i*0.13-(i>14?(i-14)*0.21:0)+Math.sin(i/2)*0.25).toFixed(2)};});
const App=()=>(<RangeBandChart data={data} height={290} bandLabel="P5–P95 expected" valueLabel="Live paper" format={v=>v.toFixed(1)+'%'} label="Live equity vs Monte Carlo band"/>);
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
