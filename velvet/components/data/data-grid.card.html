<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.bundle.css"><script src="../../assets/theme-toggle.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>.pane{display:flex;flex-direction:column;gap:14px}.r{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}</style>
<link rel="stylesheet" href="../card.css"></head><body><div id="root"></div>
<script type="text/babel">
const NS = window.VelvetUIDesignSystem_ee2bd8;
const { DataGrid, Badge, Button } = NS;
const TONE={'In progress':'info','Done':'success','On hold':'warning','At risk':'danger'};
const INIT=[['Q3 migration','In progress',128000,72,'AK +3','2 h ago','Anna Kowalska','EU-West','Low'],['Learning portal','Done',86400,100,'MN +5','yesterday','Marek Nowak','EU-Central','—'],['AI assistant','In progress',214000,48,'PZ +2','10 min ago','Piotr Zięba','US-East','Medium'],['API audit','On hold',42000,30,'KL','3 days ago','Karol Lis','EU-West','High'],['Onboarding','Done',19800,100,'AK +1','last week','Anna Kowalska','EU-North','—'],['Billing v3','At risk',96500,55,'JW +4','1 h ago','Julia Wiśniewska','EU-West','High'],['Search rebuild','In progress',54000,64,'TP +2','today','Tomasz Piątek','US-West','Medium'],['Brand refresh','Done',23000,100,'MN','2 weeks ago','Marek Nowak','EU-Central','—']].map((r,i)=>({id:i+1,name:r[0],status:r[1],budget:r[2],progress:r[3],team:r[4],updated:r[5],owner:r[6],region:r[7],risk:r[8]}));
const STAT=['In progress','Done','On hold','At risk'];
const cols=[{key:'name',label:'Project',width:190,minWidth:140,maxWidth:320,editable:true,locked:true,render:r=><b style={{fontWeight:600}}>{r.name}</b>},{key:'status',label:'Status',width:140,editable:true,options:STAT,render:r=><Badge tone={TONE[r.status]} dot>{r.status}</Badge>},{key:'budget',label:'Budget',type:'number',width:120,editable:true,format:v=>Number(v).toLocaleString('pl-PL')+' zł'},{key:'progress',label:'Progress',type:'number',width:150,render:r=><span style={{display:'flex',alignItems:'center',gap:8,width:'100%'}}><span style={{flex:1,height:4,borderRadius:2,background:'var(--bg-sunken)',overflow:'hidden'}}><span style={{display:'block',height:'100%',width:r.progress+'%',background:r.progress===100?'var(--status-success-fg, var(--action-primary))':'var(--action-primary)'}} /></span><span style={{fontFamily:'var(--font-mono)',fontSize:11,width:32,textAlign:'right'}}>{r.progress}%</span></span>},{key:'team',label:'Team',width:100},{key:'updated',label:'Updated',width:130,render:r=><span style={{color:'var(--fg-tertiary)'}}>{r.updated}</span>},{key:'region',label:'Region',width:120,hidden:true}];
const fields=[{key:'name',label:'Project'},{key:'status',label:'Status',type:'select',options:STAT.map(s=>({value:s,label:s}))},{key:'budget',label:'Budget',type:'number'},{key:'progress',label:'Progress',type:'number'},{key:'region',label:'Region'}];
const K=({k,v})=><div><div style={{font:'600 10px/1.2 var(--font-sans)',textTransform:'uppercase',letterSpacing:'.05em',color:'var(--fg-tertiary)'}}>{k}</div><div style={{fontSize:13,marginTop:3}}>{v}</div></div>;
const App=()=>{const[rows,setRows]=React.useState(INIT);const[view,setView]=React.useState({sort:{key:'budget',dir:'desc'},columns:[{key:'name',visible:true,pin:'left'},{key:'status',visible:true},{key:'budget',visible:true},{key:'progress',visible:true},{key:'team',visible:false},{key:'updated',visible:true},{key:'region',visible:true}],widths:{name:220}});
const hidden=view.columns?view.columns.filter(c=>!c.visible).map(c=>c.key):[];
return(<div className="pane"><DataGrid height={360} rows={rows} view={view} onViewChange={setView} onRowsChange={setRows} columns={cols} rowNumbers={false} selectable searchable filterFields={fields} columnManager onExport={null} footer bulkActions={sel=><><Button size="sm" variant="secondary" iconLeft="download">Export {sel.length}</Button><Button size="sm" variant="secondary" iconLeft="trash-2" onClick={()=>setRows(rows.filter(r=>!sel.includes(r)))}>Delete</Button></>} renderDetail={r=><div style={{display:'grid',gridTemplateColumns:'repeat(3,minmax(0,180px))',gap:'10px 24px'}}><K k="Owner" v={r.owner} /><K k="Region" v={r.region} /><K k="Risk level" v={r.risk} /></div>} /><span className="lbl">Controlled view → sort {view.sort?view.sort.key+' '+view.sort.dir:'none'} · hidden {hidden.join(', ')||'none'} · Reset view → column defaults · Project width 140–320</span></div>);};
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
