<link rel="stylesheet" href="../card.css"></head><body><div id="root"></div>
<script type="text/babel">
const NS = window.VelvetUIDesignSystem_ee2bd8;
const L=({children})=><span className="lbl">{children}</span>;
const { LogViewer } = NS;
const SRC=['api','worker','auth','billing'];
const MSG=[['info','GET /v1/candidates 200 in 42ms'],['debug','cache hit key=cand:list:p1'],['info','POST /v1/interviews 201 in 118ms'],['warn','Slow query on applications (812ms) — missing index on stage_id'],['info','Job email.digest completed (14 sent)'],['error','Stripe webhook signature mismatch — event evt_3Q… rejected'],['debug','token refreshed for user 4821'],['info','GET /v1/roles 200 in 31ms'],['warn','Rate limit 80% for org velvet']];
let n=0; const mk=()=>{const m=MSG[(n*7+3)%MSG.length];n++;return {ts:Date.now()-((60-n)*1500),level:m[0],source:SRC[n%SRC.length],message:m[1]};};
const INIT=Array.from({length:40},mk);
const App=()=>{
  const [lines,setLines]=React.useState(INIT);
  React.useEffect(()=>{const t=setInterval(()=>setLines(l=>[...l,{...mk(),ts:Date.now()}].slice(-500)),1200);return()=>clearInterval(t);},[]);
  return <div className="pane"><LogViewer title="api-prod · eu-central" lines={lines} height={340} /></div>;
};
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
