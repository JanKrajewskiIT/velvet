<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.bundle.css"><script src="../../assets/theme-toggle.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>.pane{display:flex;flex-direction:column;gap:12px}.r{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.lbl{font:500 11px/1.3 var(--font-mono);color:var(--fg-tertiary);width:72px;flex:none}</style>
<link rel="stylesheet" href="../card.css"></head><body><div id="root"></div>
<script type="text/babel">
const { Select } = window.VelvetUIDesignSystem_ee2bd8;
const O=[{value:'admin',label:'Admin',icon:'shield',description:'Full access, billing'},{value:'editor',label:'Editor',icon:'pencil',description:'Edit projects'},{value:'viewer',label:'Viewer',icon:'eye',description:'Read only'},{value:'guest',label:'Guest',icon:'user',disabled:true}];
const P=['Poland','Germany','France','Spain','Italy'];
const App=()=>(<div className="pane" style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14,alignItems:'start'}}>
<div style={{display:'flex',flexDirection:'column',gap:14}}><Select label="Country" options={P} placeholder="Choose a country" iconLeft="globe" /><Select label="Small" size="sm" defaultValue="Poland" options={P} /><Select label="Disabled" disabled defaultValue="Spain" options={P} /><Select label="With error" error="Required" options={P} /></div>
<div style={{display:'flex',flexDirection:'column',gap:6}}><span className="vui-label">Menu</span><div className="vui-select"><ul role="listbox" className="vui-select__menu" style={{position:'static',animation:'none'}}>{O.map((o,i)=><li key={o.value} role="option" aria-selected={o.value==='editor'} aria-disabled={o.disabled||undefined} className={'vui-select__option'+(i===0?' vui-select__option--active':'')}><i className={'vui-icon icon-'+o.icon} /><span className="vui-select__label">{o.label}{o.description&&<span className="vui-select__desc">{o.description}</span>}</span>{o.value==='editor'&&<i className="vui-icon icon-check vui-select__check" />}</li>)}</ul></div></div>
</div>);
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
