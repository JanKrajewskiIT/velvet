<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.bundle.css"><script src="../../assets/theme-toggle.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>.pane{display:flex;flex-direction:column;gap:14px}.r{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.lbl{font:500 11px/1.3 var(--font-mono);color:var(--fg-tertiary);width:72px;flex:none}</style>
<link rel="stylesheet" href="../card.css"></head><body><div id="root"></div>
<script type="text/babel">
const NS = window.VelvetUIDesignSystem_ee2bd8;
const { Input } = NS;
const App=()=>{const[p,setP]=React.useState('24');const[slug,setSlug]=React.useState('velvet-studio');const n=parseFloat(p)||0;
return(<div className="pane"><div className="g2">
<Input label="Seat price" prefix="$" suffix="USD / mo" inputMode="decimal" value={p} onChange={e=>setP(e.target.value.replace(/[^\d.]/g,''))} hint={'$'+(n*12).toLocaleString('en')+' per seat / year'} />
<Input label="Workspace URL" prefix="velvet.app/" value={slug} onChange={e=>setSlug(e.target.value.toLowerCase().replace(/[^a-z0-9-]+/g,'-'))} hint="Lowercase letters, numbers and dashes." />
<div style={{gridColumn:'1 / -1'}}><Input label="Bio" multiline rows={2} maxLength={160} showCount defaultValue="Product designer at Velvet." hint="Markdown supported." /></div>
</div></div>);};
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
