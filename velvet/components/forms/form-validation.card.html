<!-- @dsCard group="19 Forms" viewport="960x487" name="Form validation" subtitle="Submit → error summary + per-field messages · re-validates as you fix" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.bundle.css"><script src="../../assets/theme-toggle.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>.pane{display:flex;flex-direction:column;gap:14px}.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 16px}</style>
<link rel="stylesheet" href="../card.css"></head><body><div id="root"></div>
<script type="text/babel">
const { ErrorSummary, Input, Select, Checkbox, Button, Alert } = window.VelvetUIDesignSystem_ee2bd8;
const App=()=>{const[v,setV]=React.useState({name:'',email:'anna@',team:'',terms:false});const[errs,setErrs]=React.useState([]);const[ok,setOk]=React.useState(false);
const set=k=>e=>setV(s=>({...s,[k]:e&&e.target?(e.target.type==='checkbox'?e.target.checked:e.target.value):e}));
const validate=(v)=>{const E=[];if(!v.name.trim())E.push({id:'f-name',message:'Enter your full name'});if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v.email))E.push({id:'f-email',message:'Enter an email address like name@company.com'});if(!v.team)E.push({id:'f-team',message:'Choose a team'});if(!v.terms)E.push({id:'f-terms',message:'Accept the terms to continue'});return E;};
const[tried,setTried]=React.useState(true);React.useEffect(()=>{if(tried){setErrs(validate(v));}},[v]);
const submit=(e)=>{e.preventDefault();const E=validate(v);setTried(true);setErrs(E);setOk(!E.length);};
const err=id=>(errs.find(x=>x.id===id)||{}).message;
return(<form className="pane" onSubmit={submit} noValidate><ErrorSummary errors={errs} />{ok&&<Alert tone="success" title="Account created">Check your inbox to confirm.</Alert>}<div className="g2"><Input id="f-name" label="Full name" value={v.name} onChange={set('name')} error={err('f-name')} reserveHint /><Input id="f-email" label="Work email" iconLeft="mail" value={v.email} onChange={set('email')} error={err('f-email')} reserveHint /><Select id="f-team" label="Team" placeholder="Choose…" value={v.team||undefined} onChange={set('team')} options={['Design','Engineering','Research']} error={err('f-team')} /><div /></div><Checkbox id="f-terms" label="I accept the terms and privacy policy" checked={v.terms} onChange={set('terms')} />{err('f-terms')&&<span className="vui-hint vui-hint--error" style={{marginTop:-8}}>{err('f-terms')}</span>}<div><Button type="submit">Create account</Button></div></form>);};
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
