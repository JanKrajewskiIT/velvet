<!-- @dsCard group="16 Inputs" viewport="960x400" name="FileUpload" subtitle="Dropzone + list: uploading, done, error/retry, remove" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.bundle.css"><script src="../../assets/theme-toggle.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>.pane{display:flex;flex-direction:column;gap:14px}.r{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.lbl{font:500 11px/1.3 var(--font-mono);color:var(--fg-tertiary);width:72px;flex:none}</style>
<link rel="stylesheet" href="../card.css"></head><body><div id="root"></div>
<script type="text/babel">
const NS = window.VelvetUIDesignSystem_ee2bd8;
const { FileUpload } = NS;
const App=()=>{const[files,setFiles]=React.useState([{id:1,name:'brand-guidelines.pdf',size:4200000,status:'done'},{id:2,name:'hero-shot.png',size:2600000,status:'uploading',progress:45},{id:3,name:'contract-signed.pdf',size:31000000,status:'error',error:'Over 20 MB'}]);
const run=(id)=>{const t=setInterval(()=>setFiles(fs=>fs.map(f=>{if(f.id!==id)return f;const p=Math.min(100,(f.progress||0)+12+Math.random()*10);return p>=100?{...f,progress:100,status:'done'}:{...f,progress:p};})),350);setTimeout(()=>clearInterval(t),4000);};
React.useEffect(()=>run(2),[]);
const add=(list)=>{const nf=list.map((f,i)=>({id:Date.now()+i,name:f.name,size:f.size,status:'uploading',progress:0}));setFiles(fs=>[...fs,...nf]);nf.forEach(f=>run(f.id));};
return(<div className="pane"><FileUpload files={files} onFiles={add} maxSize={20*1024*1024} accept="image/*,.pdf" hint="PNG, JPG or PDF — up to 20 MB" emptyText="No files yet — drop something above." onRemove={id=>setFiles(fs=>fs.filter(f=>f.id!==id))} onRetry={id=>{setFiles(fs=>fs.map(f=>f.id===id?{...f,status:'uploading',progress:0,error:undefined}:f));run(id);}} /></div>);};
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
