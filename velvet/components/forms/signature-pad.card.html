const NS = window.VelvetUIDesignSystem_ee2bd8;
const L=({children})=><span className="lbl">{children}</span>;
const { SignaturePad } = NS;
const App=()=>{
  const [png,setPng]=React.useState(null);
  return <div className="pane"><div className="g2" style={{gridTemplateColumns:'minmax(0,3fr) minmax(0,2fr)'}}>

  </div></div>;
};
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
