<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.bundle.css"><script src="../../assets/theme-toggle.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>.pane{display:flex;flex-direction:column;gap:14px}.r{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}.col{display:flex;flex-direction:column;gap:6px;min-width:0}</style>
<link rel="stylesheet" href="../card.css"></head><body><div id="root"></div>
<script type="text/babel">
const NS = window.VelvetUIDesignSystem_ee2bd8;
const L=({children})=><span className="lbl">{children}</span>;
const { VisuallyHidden, SkipLink, LiveRegion, Button, Count } = NS;
const App=()=>{
  const [msg,setMsg]=React.useState(null);
  return <div className="pane">
    <SkipLink href="#a11y-main" />
    <div className="g2" style={{gridTemplateColumns:'repeat(3,minmax(0,1fr))'}}>
      <div className="col"><L>SkipLink — Tab into the card</L><div className="r"><Button size="sm" variant="secondary" onClick={()=>document.querySelector('.vui-skiplink').focus()}>Focus skip link</Button></div><span className="lbl">appears top-left, jumps to #main</span></div>
      <div className="col"><L>VisuallyHidden</L><div className="r" style={{gap:8}}><span style={{font:'var(--type-label)'}}>Inbox</span><Count value={3} /><VisuallyHidden>3 unread messages</VisuallyHidden></div><span className="lbl">reads “Inbox 3 unread messages”</span></div>
      <div className="col" id="a11y-main"><L>LiveRegion · visible</L><div className="r"><Button size="sm" variant="secondary" onClick={()=>setMsg({text:'Changes saved',id:Date.now()})}>Save</Button><Button size="sm" variant="ghost" onClick={()=>setMsg({text:'12 results',id:Date.now()})}>Search</Button></div><LiveRegion message={msg} visible clearAfter={3000} /></div>
    </div>
  </div>;
};
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
