<!-- @dsCard group="11 Atoms" viewport="960x288" name="Swatch" subtitle="size · shape · state · tone" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.bundle.css"><link rel="stylesheet" href="../../guidelines/card.css"><script src="../../assets/theme-toggle.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<link rel="stylesheet" href="../card.css"></head><body><div id="root"></div>
<script type="text/babel">
const NS = window.VelvetUIDesignSystem_ee2bd8;
const { Swatch } = NS;
const C=['#8b0036','#1b8a9c','#d98200','#1f9254','#5b6bd6','#7a52cc','#3a3437'];
const Row=({k,children})=>(<div className="grid" style={{gridTemplateColumns:'110px minmax(0,1fr)',gap:16}}><span className="k">{k}</span><div className="row" style={{gap:12}}>{children}</div></div>);
const App=()=>{const[on,setOn]=React.useState(C[1]);return(<div className="col" style={{gap:18}}>
<Row k="size">{['sm','md','lg'].map(s=><Swatch key={s} size={s} color={C[0]} />)}{['sm','md','lg'].map(s=><Swatch key={'r'+s} size={s} round color={C[0]} />)}</Row>
<Row k="tone">{['brand','success','warning','danger','info','blue','violet','teal','olive','slate'].map(t=><Swatch key={t} tone={t} size="sm" round />)}</Row>
<Row k="selectable">{C.map(c=><Swatch key={c} size="lg" color={c} label={c} selected={on===c} onClick={()=>setOn(c)} />)}</Row>
<Row k="fill grid"><div className="grid" style={{gridTemplateColumns:'repeat(8,minmax(0,1fr))',gap:6,width:'100%'}}>{[...C,'#e05f88'].map(c=><Swatch key={c} size="fill" color={c} />)}</div></Row>
</div>)};
ReactDOM.createRoot(document.getElementById('root')).render(<div className="pane"><App /></div>);
</script></body></html>
