<link rel="stylesheet" href="../card.css"></head><body><div id="root"></div>
<script type="text/babel">
const NS = window.VelvetUIDesignSystem_ee2bd8;
const { NotificationCenter, Avatar } = NS;
const INIT=[{id:1,title:'Anna mentioned you in Atlas redesign',body:'“@you can you review the nav spacing before Friday?”',time:'2m ago',unread:true,avatar:<Avatar name="Anna Kowalska" size="sm" />},{id:2,title:'Export finished',body:'members-2026-09.csv is ready to download.',time:'1h ago',unread:true,tone:'success'},{id:3,title:'Storage almost full',body:'You’ve used 92% of 20 GB.',time:'Yesterday',unread:true,tone:'warning'},{id:4,title:'Marek joined the workspace',time:'Mon',tone:'brand',icon:'users'}];
const App=()=>{const[items,setItems]=React.useState(INIT);return(<div className="pane"><div style={{display:'flex',justifyContent:'flex-end'}}><NotificationCenter defaultOpen items={items} onMarkAllRead={()=>setItems(i=>i.map(x=>({...x,unread:false})))} onItemClick={(n)=>setItems(i=>i.map(x=>x.id===n.id?{...x,unread:false}:x))} onViewAll={()=>{}} /></div></div>);};
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
