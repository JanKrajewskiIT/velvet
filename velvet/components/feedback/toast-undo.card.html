<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.bundle.css"><script src="../../assets/theme-toggle.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>.pane{display:flex;flex-direction:column;gap:12px}.r{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.lbl{font:500 11px/1.3 var(--font-mono);color:var(--fg-tertiary);width:72px;flex:none}</style>
<link rel="stylesheet" href="../card.css"></head><body><div id="root"></div>
<script type="text/babel">
const NS = window.VelvetUIDesignSystem_ee2bd8;
const { Toast, Button } = NS;
const App=()=>{const[items,setItems]=React.useState(['Q3 roadmap','Brand refresh','Pricing v3']);const[toasts,setToasts]=React.useState([]);
const archive=(name)=>{setItems(i=>i.filter(x=>x!==name));const id=Date.now();setToasts(t=>[...t,{id,name}]);};
const undo=(t)=>{setItems(i=>[...i,t.name]);setToasts(ts=>ts.filter(x=>x.id!==t.id));};
return(<div className="pane" style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20,alignItems:'start'}}>
<div style={{display:'flex',flexDirection:'column',gap:6}}>{items.map(n=><div key={n} className="r" style={{justifyContent:'space-between',padding:'8px 12px',border:'1px solid var(--border-subtle)',borderRadius:10}}><span style={{fontSize:14}}>{n}</span><Button size="sm" variant="ghost" onClick={()=>archive(n)}>Archive</Button></div>)}{!items.length&&<div style={{fontSize:13,color:'var(--fg-tertiary)'}}>Everything is archived.</div>}</div>
<div style={{display:'flex',flexDirection:'column',gap:8}}>{toasts.length?toasts.map(t=><Toast key={t.id} tone="neutral" icon="inbox" title={'Archived “'+t.name+'”'} duration={6000} onUndo={()=>undo(t)} onClose={()=>setToasts(ts=>ts.filter(x=>x.id!==t.id))} />):<Toast tone="success" title="Changes saved" description="Hover to pause the countdown." duration={600000} onClose={()=>{}} />}</div>
</div>);};
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
