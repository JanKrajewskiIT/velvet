<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.bundle.css"><script src="../../assets/theme-toggle.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>.pane{display:flex;flex-direction:column;gap:14px}.r{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}</style>
<link rel="stylesheet" href="../card.css"></head><body><div id="root"></div>
<script type="text/babel">
const NS = window.VelvetUIDesignSystem_ee2bd8;
const { StatusPage, EmptyState, ErrorState, Button, OptionSwitcher } = NS;
const sm={size:'sm'};
const views={
'404':()=> <StatusPage code={404} actions={<><Button {...sm} variant="secondary" iconLeft="arrow-left">Go back</Button><Button {...sm}>Home</Button></>} />,
'403':()=> <StatusPage code={403} actions={<><Button {...sm} variant="secondary">Switch account</Button><Button {...sm}>Request access</Button></>} />,
'500':()=> <StatusPage code={500} actions={<><Button {...sm} variant="secondary">Status page</Button><Button {...sm} iconLeft="refresh">Try again</Button></>} />,
offline:()=> <StatusPage code="offline" actions={<Button {...sm} iconLeft="refresh">Retry</Button>} />,
success:()=> <StatusPage status="success" size="md" title="Payment received" description="We emailed the receipt to anna@velvet.app." actions={<><Button {...sm} variant="secondary">View receipt</Button><Button {...sm}>Go to dashboard</Button></>} />,
warning:()=> <StatusPage status="warning" size="md" title="Import finished with 3 issues" description="118 of 121 contacts were added." actions={<Button {...sm}>Review issues</Button>} />,
empty:()=> <EmptyState icon="folder" title="No projects yet" description="Create your first project to start collaborating with your team." actions={<><Button {...sm} variant="secondary">Import</Button><Button {...sm} iconLeft="plus">New project</Button></>} />,
error:()=> <ErrorState title="Couldn’t load invoices" description="The server took too long to respond." onRetry={()=>{}} details={'GET /api/invoices 504\nGateway Timeout'} />};
const App=()=>{const[c,setC]=React.useState('404');const V=views[c];return(<div className="pane" style={{gap:8}}><OptionSwitcher size="sm" options={['404','403','500','offline','success','warning','empty','error']} value={c} onValueChange={setC} /><div style={{display:'grid',placeItems:'center',minHeight:540}}><V /></div></div>);};
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
