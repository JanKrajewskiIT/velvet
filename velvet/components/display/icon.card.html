<!-- @dsCard group="05 Icons" viewport="960x680" name="Velvet Icons" subtitle="Search, size, stroke, colour, construction, copy/download" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.bundle.css"><script src="../../assets/theme-toggle.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>.pane{display:flex;flex-direction:column;gap:12px}.r{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.lbl{font:500 11px/1.3 var(--font-mono);color:var(--fg-tertiary);width:72px;flex:none}.ico-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:4px;align-content:start;overflow-y:auto;padding:2px}.ico{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:72px;border:0;border-radius:10px;background:none;color:inherit;cursor:pointer;font:inherit}.ico:hover{background:var(--bg-hover)}.ico[aria-pressed="true"]{background:var(--bg-selected);color:var(--fg-brand)}.ico span{font:500 9.5px/1.1 var(--font-mono);color:var(--fg-tertiary);max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sw{width:22px;height:22px;border-radius:50%;border:2px solid var(--bg-raised);box-shadow:0 0 0 1px var(--border-default);cursor:pointer;padding:0}.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--border-focus)}.code{font:500 11px/1.45 var(--font-mono);background:var(--bg-sunken);border-radius:8px;padding:8px 10px;color:var(--fg-secondary);word-break:break-all;cursor:pointer;border:0;text-align:left;width:100%}.code:hover{color:var(--fg-primary)}input[type=range]{accent-color:var(--bg-brand);width:100%}</style>
<link rel="stylesheet" href="../card.css"></head><body><div id="root"></div>
<script type="text/babel">
const { Icon, VelvetIcons, IconCategories, Input, Tabs, Tag, Button, Switch } = window.VelvetUIDesignSystem_ee2bd8;
const SIZES=['16','20','24','32','48'];
const COLORS=[['var(--fg-primary)','Primary'],['var(--fg-secondary)','Secondary'],['var(--fg-brand)','Brand'],['var(--status-success-fg)','Success'],['var(--status-danger-fg)','Danger']];
const GRID=[...Array(25)].map((_,i)=><g key={i}><line x1={i} y1="0" x2={i} y2="24"/><line x1="0" y1={i} x2="24" y2={i}/></g>);
function Construction({name,stroke,keylines}){return(<svg viewBox="-1 -1 26 26" width="100%" style={{display:'block',aspectRatio:'1',background:'var(--bg-subtle)',borderRadius:12}}>
  {keylines&&<><g stroke="var(--border-subtle)" strokeWidth=".05">{GRID}</g>
  <rect x="2" y="2" width="20" height="20" fill="none" stroke="var(--velvet-300)" strokeWidth=".07" strokeDasharray=".4 .3"/>
  <circle cx="12" cy="12" r="10" fill="none" stroke="var(--velvet-300)" strokeWidth=".07" strokeDasharray=".4 .3"/>
  <rect x="3" y="3" width="18" height="18" rx="3" fill="none" stroke="var(--velvet-200)" strokeWidth=".07"/>
  <rect x="4" y="2" width="16" height="20" rx="3" fill="none" stroke="var(--velvet-200)" strokeWidth=".07"/><rect x="2" y="4" width="20" height="16" rx="3" fill="none" stroke="var(--velvet-200)" strokeWidth=".07"/></>}
  <g fill="none" stroke="var(--fg-primary)" strokeWidth={stroke} strokeLinecap="round" strokeLinejoin="round" dangerouslySetInnerHTML={{__html:VelvetIcons[name]}} />
</svg>);}
const App=()=>{
  const[q,setQ]=React.useState('');const[cat,setCat]=React.useState('all');const[size,setSize]=React.useState('24');
  const[stroke,setStroke]=React.useState(1.75);const[color,setColor]=React.useState(COLORS[0][0]);const[sel,setSel]=React.useState('sparkles');
  const[keys,setKeys]=React.useState(true);const[copied,setCopied]=React.useState('');
  const names=(cat==='all'?Object.values(IconCategories).flat():IconCategories[cat]).filter(n=>n.includes(q.trim().toLowerCase()));
  const copy=(k,t)=>{navigator.clipboard&&navigator.clipboard.writeText(t).catch(()=>{});setCopied(k);setTimeout(()=>setCopied(''),1200);};
  const svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="'+size+'" height="'+size+'" fill="none" stroke="currentColor" stroke-width="'+stroke+'" stroke-linecap="round" stroke-linejoin="round">'+VelvetIcons[sel]+'</svg>';
  const snippets=[['html','<i class="vui-icon icon-'+sel+'"></i>'],['react','<Icon name="'+sel+'" size={'+size+'}'+(stroke!==1.75?' strokeWidth={'+stroke+'}':'')+' />']];
  return(<div className="pane" style={{height:'100vh',display:'grid',gridTemplateColumns:'minmax(0,1fr) 260px',gridTemplateRows:'auto auto minmax(0,1fr)',gap:14}}>
    <div style={{gridColumn:'1 / -1',display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}>
      <div style={{flex:'1 1 200px'}}><Input size="sm" iconLeft="search" placeholder={'Search '+Object.values(IconCategories).flat().length+' icons…'} value={q} onChange={e=>setQ(e.target.value)} /></div>
      <Tabs variant="segmented" value={size} onChange={setSize} items={SIZES.map(s=>({value:s,label:s}))} />
      <div style={{display:'flex',gap:6}}>{COLORS.map(([v,l])=><button key={l} title={l} className="sw" aria-pressed={color===v} style={{background:v}} onClick={()=>setColor(v)} />)}</div>
    </div>
    <div style={{gridColumn:'1 / -1',display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}>
      {[['all','All'],...Object.keys(IconCategories).map(k=>[k,k])].map(([v,l])=><Tag key={v} size="sm" selected={cat===v} onClick={()=>setCat(v)}>{l}</Tag>)}
      <div style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:10,width:190}}><span className="cap" style={{whiteSpace:'nowrap'}}>Stroke {stroke.toFixed(2)}</span><input type="range" min="1" max="2.5" step="0.25" value={stroke} onChange={e=>setStroke(+e.target.value)} /></div>
    </div>
    <div className="ico-grid" style={{color}}>
      {names.map(n=><button key={n} className="ico" aria-pressed={sel===n} onClick={()=>setSel(n)} title={n}><Icon name={n} size={+size} strokeWidth={stroke} /><span>{n}</span></button>)}
      {!names.length&&<div style={{gridColumn:'1 / -1',padding:40,textAlign:'center',color:'var(--fg-tertiary)'}}>No icons match “{q}”.</div>}
    </div>
    <aside style={{display:'flex',flexDirection:'column',gap:12,minHeight:0,overflowY:'auto',borderLeft:'1px solid var(--border-subtle)',paddingLeft:14}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}><span style={{fontFamily:'var(--font-display)',fontWeight:600,fontSize:17,letterSpacing:'-0.02em'}}>{sel}</span><Switch size="sm" label="Grid" checked={keys} onChange={e=>setKeys(e.target.checked)} /></div>
      <Construction name={sel} stroke={stroke} keylines={keys} />
      <div style={{display:'flex',alignItems:'flex-end',justifyContent:'space-between',color}}>{[12,16,20,24,32].map(s=><div key={s} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:4}}><Icon name={sel} size={s} strokeWidth={s<=14?2:stroke} /><span className="cap" style={{fontSize:9}}>{s}</span></div>)}</div>
      {snippets.map(([k,t])=><button key={k} className="code" onClick={()=>copy(k,t)} title="Copy"><span className="cap" style={{display:'block',marginBottom:4,fontSize:9}}>{copied===k?'Copied ✓':k}</span>{t}</button>)}
      <div style={{display:'flex',gap:8}}>
        <Button size="sm" variant="secondary" iconLeft="copy" onClick={()=>copy('svg',svg)} style={{flex:1}}>{copied==='svg'?'Copied':'SVG'}</Button>
        <Button size="sm" variant="secondary" iconLeft="download" style={{flex:1}} onClick={()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));a.download=sel+'.svg';a.click();}}>Download</Button>
      </div>
    </aside>
  </div>);};
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
